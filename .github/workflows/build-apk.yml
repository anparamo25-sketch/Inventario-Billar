name: Inventario Billar - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventario-billar-build
  cancel-in-progress: false

jobs:
  build:
    name: Analyze and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android platform files if needed
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name inventario_billar .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze entire application
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Inventario-Billar-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-Billar-release
          path: Inventario-Billar-release.apk
          if-no-files-found: error
          retention-days: 30
